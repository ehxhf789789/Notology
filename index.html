<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notology-project</title>
    <script>
      // Apply theme INSTANTLY before CSS parses to prevent dark/light flash
      var __p = new URLSearchParams(window.location.search);
      var __t = __p.get('theme');
      if (!__t) {
        // All windows (main, vault-selector, hover): use system preference as instant fallback
        // This prevents the dark background flash when user is in light mode
        __t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      if (__t === 'system') __t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', __t);
      document.documentElement.style.backgroundColor = __t === 'light' ? '#F2F2F7' : '#000000';
      document.documentElement.style.color = __t === 'light' ? 'rgba(0,0,0,0.92)' : 'rgba(255,255,255,0.95)';
    </script>
    <style>
      /* Background set by inline script above based on system preference / theme param */
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: inherit;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/core/app/main.tsx"></script>
  </body>
</html>
