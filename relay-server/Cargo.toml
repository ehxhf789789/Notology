[package]
name = "notology-relay"
version = "0.1.0"
edition = "2021"
description = "Lightweight WebSocket relay for Notology real-time sync notifications"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"
lto = true
strip = true
